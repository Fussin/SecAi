version: '3.8'

services:
  load_balancer:
    image: haproxy:2.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./haproxy:/usr/local/etc/haproxy:ro
    depends_on:
      - go_worker
      - python_worker

  go_worker:
    build:
      context: .
      dockerfile: docker/scanner/Dockerfile
    deploy:
      replicas: 5

  python_worker:
    build:
      context: .
      dockerfile: docker/ai/Dockerfile
    deploy:
      replicas: 5

  playwright_worker:
    image: mcr.microsoft.com/playwright:v1.40.0-focal
    deploy:
      replicas: 2

  ai_gpu_node:
    build:
      context: .
      dockerfile: docker/ai/Dockerfile
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ai_cpu_node:
    build:
      context: .
      dockerfile: docker/ai/Dockerfile
    deploy:
      replicas: 2

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autonomouspen
      POSTGRES_USER: autonomouspen
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data

volumes:
  postgres_data:
  redis_data:
  minio_data:
